name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install verification tools
        run: brew install gitleaks xcodegen

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          gitleaks version

      - name: Verify publication and platforms
        run: scripts/verify.sh
